<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06070f">
  <title>Master AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="idle">
  <header class="stage">
    <machine-dream id="orb" hud="none" background="#06070f"></machine-dream>
  </header>

  <main id="thread" class="thread" aria-live="polite"></main>

  <div class="dock">
    <p id="status" class="status"></p>
    <form id="composer" class="composer" autocomplete="off">
      <textarea id="q" rows="1" placeholder="問いかけてください" aria-label="質問"></textarea>
      <button id="reset" class="reset" type="button" aria-label="会話をリセット" title="会話をリセット">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
      <button id="send" class="send" type="submit" aria-label="送信" disabled>
        <svg class="i-send" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <svg class="i-stop" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
      </button>
    </form>
  </div>

  <dialog id="settings" class="settings" aria-labelledby="settings-title">
    <form id="settings-form" method="dialog">
      <h2 id="settings-title">設定</h2>

      <section id="keys-section" class="group">
        <h3>APIキー</h3>
        <p class="hint">このブラウザ内にだけ保存され、各サービスのAPIへ直接送られます。</p>
        <label class="key">
          <span>OpenRouter <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">キーを取得</a></span>
          <input name="key-openrouter" type="password" placeholder="sk-or-..." autocomplete="off" spellcheck="false">
        </label>
        <details>
          <summary>公式API（OpenAI・Anthropic・Google）</summary>
          <label class="key"><span>OpenAI</span><input name="key-openai" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false"></label>
          <label class="key"><span>Anthropic</span><input name="key-claude" type="password" placeholder="sk-ant-..." autocomplete="off" spellcheck="false"></label>
          <label class="key"><span>Google</span><input name="key-gemini" type="password" placeholder="AI..." autocomplete="off" spellcheck="false"></label>
        </details>
      </section>

      <section class="group">
        <h3>議論するAI</h3>
        <div id="seats"></div>
        <div class="pick-tools">
          <button type="button" id="auto-pick" class="small">おまかせで選ぶ</button>
          <label class="check"><input type="checkbox" name="open-only" checked> オープンウェイトのみ</label>
          <label class="check"><input type="checkbox" name="free-only"> 無料のみ</label>
        </div>
      </section>

      <div class="row">
        <label>結論をまとめるAI
          <select name="master"><option value="0">1番目</option><option value="1">2番目</option><option value="2">3番目</option></select>
        </label>
        <label>議論のラウンド
          <select name="rounds"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
        </label>
      </div>

      <div class="actions">
        <button class="primary" value="save">保存</button>
        <button value="cancel" formnovalidate>閉じる</button>
        <button class="ghost" value="clear" formnovalidate>設定を消去</button>
      </div>
    </form>
  </dialog>

  <script src="machine-dream.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
